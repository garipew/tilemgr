<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Create Project</title>
		<link rel="stylesheet" href="/css/new_project.css">
	</head>
	<body>
		<div class="container card">
			<h1>Create Project</h1>
			<form action="/projects/new" method="post" enctype="multipart/form-data">
				<label>
					Project name
					<input name="name" value="Default" required>
				</label>
				<div class="row">
					<label>
						Tile width (px)
						<input name="t_wid" type="number" value="16" required>
					</label>
					<label>
						Tile height (px)
						<input name="t_hei" type="number" value="16" required>
					</label>
				</div>
				<div class="row">
					<label>
						Columns (tiles)
						<input name="wid" type="number" value="10" required>
					</label>
					<label>
						Rows (tiles)
						<input name="hei" type="number" value="10" required>
					</label>
				</div>
				<label>
					Tileset image (PNG)
					<input name="image" type="file" accept="image/png" required>
				</label>
				<button type="submit" class="btn">Create Project</button>
			</form>
		</div>
	</body>
</html>
